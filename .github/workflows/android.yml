name: Chi Android (build, lint, unit)
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Build APK, lint, unit tests (not instrumentation)
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
