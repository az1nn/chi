name: Chi foundation
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]
jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository foundation contracts (not Android runtime)
        run: python3 scripts/verify_repo.py

  spec-kit-bootstrap-preview:
    # T004 preflight only: never push upstream-generated files or mark the bootstrap complete.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documented official Spec Kit release
        run: python -m pip install --disable-pip-version-check specify-cli==0.12.11
      - name: Bootstrap a disposable checkout and enforce Chi ownership
        run: |
          specify version
          test -z "$(git status --porcelain)"
          bash scripts/bootstrap-spec-kit.sh
          test -f .specify/integration.json
          find .github/skills -mindepth 2 -maxdepth 2 -name SKILL.md | grep -q '/speckit-'
          git diff --exit-code -- .specify/memory/constitution.md AGENTS.md .github/skills/siga/SKILL.md .github/skills/android-ime/SKILL.md
          python3 scripts/verify_repo.py
      - name: Preserve generated diff as review evidence (never commit)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/spec-kit-preview"
          {
            echo "Pull request: #1"
            echo "Source HEAD: $(git rev-parse HEAD)"
            echo "Spec Kit: $(specify version 2>&1 || echo unavailable)"
          } > "$RUNNER_TEMP/spec-kit-preview/manifest.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/spec-kit-preview/status.txt"
          git diff --binary > "$RUNNER_TEMP/spec-kit-preview/tracked.patch"
          git ls-files --others --exclude-standard -z | tar --create --gzip --file="$RUNNER_TEMP/spec-kit-preview/new-files.tar.gz" --null --files-from=-
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chi-spec-kit-bootstrap-preview
          path: ${{ runner.temp }}/spec-kit-preview/
          retention-days: 14
          if-no-files-found: warn

  spec-kit-bootstrap-import:
    # Temporary one-shot CI worker for T004; only the known Chi PR branch, never merge/release.
    needs: [governance, spec-kit-bootstrap-preview]
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/001-chi-skills-speckit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Spec Kit and generate in Chi PR checkout
        run: |
          python -m pip install --disable-pip-version-check specify-cli==0.12.11
          bash scripts/bootstrap-spec-kit.sh
          test -f .specify/integration.json
          find .github/skills -mindepth 2 -maxdepth 2 -name SKILL.md | grep -q '/speckit-'
          git diff --exit-code -- .specify/memory/constitution.md AGENTS.md .github/skills/siga/SKILL.md .github/skills/android-ime/SKILL.md
          python3 scripts/verify_repo.py
      - name: Audit generated paths and fast-forward PR branch only
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all
          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4-)"
          if [[ -z "$changed" ]]; then
            echo "Spec Kit already versioned; no changes to push."
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.specify/|\.github/skills/speckit-)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "BLOCK: generator touched non-Spec Kit-owned paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git add -A -- .specify/ .github/skills/speckit-*
          git diff --cached --name-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(chi): install official Spec Kit 0.12.11 skills and templates"
          # Git push is deliberately non-forced: concurrent branch changes must reject this commit.
          git push origin HEAD:refs/heads/feat/001-chi-skills-speckit
