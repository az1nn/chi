name: Chi foundation
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]
jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Chi and official Spec Kit repository contracts (not Android runtime)
        run: python3 scripts/verify_repo.py
